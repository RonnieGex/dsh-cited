name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    name: Portable tests and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Install declared development dependencies without scripts or lockfile changes
        run: npm install --ignore-scripts --package-lock=false
      - name: Test portable contracts
        run: node --test tests/cited.test.mjs tests/module.test.mjs tests/package.test.mjs tests/tools.test.mjs tests/readme.test.mjs
      - name: Check shipped build
        run: node scripts/build.mjs --check
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install verified scanner
        run: |
          curl --fail --silent --show-error --location --output /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file /tmp/gitleaks.tar.gz --directory /tmp gitleaks
      - name: Scan history
        run: /tmp/gitleaks git --redact --no-banner
