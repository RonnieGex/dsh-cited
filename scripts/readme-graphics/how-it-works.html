<div class="topline"><span class="eyebrow">{{FLOWEYEBROW}}</span><span class="eyebrow muted">{{STEPS}}</span></div>
<div class="flow"><h2>{{FLOWHEAD}}</h2>
<div class="step"><span class="number">01</span><div><h3>{{ADD}}</h3><p class="muted">{{ADDDETAIL}}</p></div><div class="step-detail address">dsh plugin add github:RonnieGex/dsh-cited</div></div>
<div class="step"><span class="number">02</span><div><h3>{{CONNECT}}</h3><p class="muted">{{CONNECTDETAIL}}</p></div><div class="settings"><span>url</span><span class="muted">{{ADDRESS}}</span><span>token</span><span class="muted">{{TOKEN}}</span></div></div>
<div class="step"><span class="number">03</span><div><h3>{{ASK}}</h3><p class="muted">{{ASKDETAIL}}</p></div><div class="step-detail">{{ANSWER}} <span class="mark citation-chip">1</span><br><span class="muted">{{SOURCE}}</span></div></div></div>
